<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Local SEO Certified Individual">
  <defs>
    <linearGradient id="lsSilver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDFDFE"/>
      <stop offset="50%" stop-color="#EEF1F4"/>
      <stop offset="100%" stop-color="#D6DCE3"/>
    </linearGradient>
    <linearGradient id="lsBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4A86BE"/>
      <stop offset="100%" stop-color="#265F92"/>
    </linearGradient>
  </defs>

  <!-- Rounded square card with silver fill + blue border -->
  <rect x="34" y="34" width="172" height="172" rx="30" fill="url(#lsSilver)" stroke="url(#lsBorder)" stroke-width="6"/>
  <rect x="44" y="44" width="152" height="152" rx="22" fill="none" stroke="#B9C6D4" stroke-width="1.2" opacity=".6"/>
  <rect x="44" y="44" width="152" height="60" rx="22" fill="#FFFFFF" opacity=".28"/>

  <text x="120" y="92" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="3" fill="#2E70A8">LOCAL</text>
  <text x="120" y="140" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="1" fill="#1F5788">SEO</text>
  <text x="120" y="166" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2" fill="#2E70A8">CERTIFIED</text>
  <line x1="66" y1="176" x2="174" y2="176" stroke="#5A86AE" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.5 6"/>
  <text x="120" y="191" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="3" fill="#6B7A88">INDIVIDUAL</text>
</svg>
