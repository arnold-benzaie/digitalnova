<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" role="img" aria-labelledby="title desc">
  <title id="title">Local SEO Certified badge</title>
  <desc id="desc">Blue rounded square badge for local SEO expertise.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#245f9f"/>
      <stop offset="1" stop-color="#0d315f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef5fb"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="9" stdDeviation="6" flood-color="#0d315f" flood-opacity=".25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="38" y="29" width="144" height="174" rx="16" fill="url(#paper)" stroke="url(#frame)" stroke-width="5"/>
    <rect x="48" y="39" width="124" height="154" rx="11" fill="none" stroke="#8fb2d2" stroke-width="2"/>
    <path d="M110 51c-15 0-27 12-27 27 0 22 27 48 27 48s27-26 27-48c0-15-12-27-27-27z" fill="#1f5f9e"/>
    <circle cx="110" cy="78" r="10" fill="#fff"/>
    <text x="110" y="143" text-anchor="middle" fill="#173c70" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="2">LOCAL</text>
    <text x="110" y="169" text-anchor="middle" fill="#173c70" font-family="Arial, sans-serif" font-size="29" font-weight="900" letter-spacing="1">SEO</text>
    <path d="M63 177h94" stroke="#c5d5e5" stroke-width="2"/>
    <text x="110" y="189" text-anchor="middle" fill="#27649d" font-family="Arial, sans-serif" font-size="8" font-weight="800" letter-spacing="1.6">CERTIFIED INDIVIDUAL</text>
  </g>
</svg>
