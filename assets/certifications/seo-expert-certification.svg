    <circle cx="120" cy="8" r="9"/><circle cx="135.7" cy="9.1" r="9"/><circle cx="151.1" cy="12.3" r="9"/><circle cx="165.9" cy="17.6" r="9"/><circle cx="179.8" cy="24.9" r="9"/><circle cx="192.6" cy="34" r="9"/><circle cx="204" cy="44.8" r="9"/><circle cx="213.9" cy="57" r="9"/><circle cx="222.1" cy="70.5" r="9"/><circle cx="228.4" cy="84.9" r="9"/><circle cx="232.7" cy="100" r="9"/><circle cx="234.9" cy="115.5" r="9"/><circle cx="235" cy="131.1" r="9"/><circle cx="232.9" cy="146.6" r="9"/><circle cx="228.7" cy="161.7" r="9"/><circle cx="222.5" cy="176.1" r="9"/><circle cx="214.3" cy="189.6" r="9"/><circle cx="204.5" cy="201.9" r="9"/><circle cx="193.1" cy="212.8" r="9"/><circle cx="180.4" cy="222" r="9"/><circle cx="166.6" cy="229.4" r="9"/><circle cx="151.8" cy="234.8" r="9"/><circle cx="136.5" cy="238.1" r="9"/><circle cx="120.8" cy="239.3" r="9"/><circle cx="105.1" cy="238.3" r="9"/><circle cx="89.7" cy="235.2" r="9"/><circle cx="74.8" cy="230" r="9"/><circle cx="60.8" cy="222.9" r="9"/><circle cx="47.9" cy="213.9" r="9"/><circle cx="36.4" cy="203.3" r="9"/><circle cx="26.4" cy="191.2" r="9"/><circle cx="18.1" cy="177.8" r="9"/><circle cx="11.7" cy="163.4" r="9"/><circle cx="7.2" cy="148.3" r="9"/><circle cx="4.9" cy="132.8" r="9"/><circle cx="4.7" cy="117.2" r="9"/><circle cx="6.7" cy="101.7" r="9"/><circle cx="10.8" cy="86.6" r="9"/><circle cx="16.9" cy="72.1" r="9"/><circle cx="25" cy="58.6" r="9"/><circle cx="34.7" cy="46.2" r="9"/><circle cx="46" cy="35.3" r="9"/><circle cx="58.6" cy="26" r="9"/><circle cx="72.3" cy="18.5" r="9"/><circle cx="86.9" cy="12.9" r="9"/><circle cx="102.2" cy="9.5" r="9"/>
  </g>

  <!-- Inner ring line -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#EAF3F6" stroke-width="2.5" opacity=".85"/>

  <!-- Top curved text -->
  <text font-family="'Outfit',Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="5" fill="#EAF3F6">
    <textPath href="#seoTopArc" startOffset="50%" text-anchor="middle">CANCANIT</textPath>
  </text>

  <!-- Star SEO Star -->
  <text x="82" y="105" font-size="18" fill="#EAF3F6">★</text>
  <text x="120" y="108" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="2">SEO</text>
  <text x="142" y="105" font-size="18" fill="#EAF3F6">★</text>

  <!-- Search engine optimization -->
  <text x="120" y="124" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="8" font-weight="600" letter-spacing="1.5" fill="#EAF3F6">SEARCH ENGINE OPTIMIZATION</text>

  <!-- Divider lines -->
  <line x1="70" y1="134" x2="170" y2="134" stroke="#EAF3F6" stroke-width="1.5" opacity=".7"/>

  <!-- Expert Certification -->
  <text x="120" y="152" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">EXPERT</text>
  <text x="120" y="167" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">CERTIFICATION</text>

  <!-- SEO small -->
  <text x="120" y="188" text-anchor="middle" font-family="'Outfit',Arial,sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1">SEO</text>

  <!-- Bottom curved text -->
  <text font-family="'Outfit',Arial,sans-serif" font-size="8" font-weight="600" letter-spacing="3" fill="#EAF3F6">
    <textPath href="#seoBotArc" startOffset="50%" text-anchor="middle">CERTIFIED PROFESSIONAL</textPath>
