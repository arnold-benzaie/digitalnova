<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="SEO Expert Certification">
  <defs>
    <radialGradient id="seoTeal" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#7FB3C4"/>
      <stop offset="70%" stop-color="#6BA0B4"/>
      <stop offset="100%" stop-color="#5B8EA3"/>
    </radialGradient>
    <path id="seoTopArc" d="M120 44 m-70 0 a70 70 0 0 1 140 0" fill="none"/>
    <path id="seoBotArc" d="M120 196 m-66 0 a66 66 0 0 0 132 0" fill="none"/>
  </defs>

  <!-- Scalloped outer edge -->
  <g fill="url(#seoTeal)">
