<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" role="img" aria-labelledby="title desc">
  <title id="title">Google Ads Certified badge</title>
  <desc id="desc">Red professional certification stamp with Google Ads lettering.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="5" flood-color="#7d1f18" flood-opacity=".25"/>
    </filter>
    <path id="topArc" d="M41 114a69 69 0 0 1 138 0"/>
    <path id="bottomArc" d="M174 139a69 69 0 0 1-128 0"/>
  </defs>
  <g filter="url(#shadow)" transform="rotate(-7 110 116)">
