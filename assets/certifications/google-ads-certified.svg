    <circle cx="110" cy="116" r="78" fill="none" stroke="#d76a5d" stroke-width="2" stroke-dasharray="5 3"/>
    <circle cx="110" cy="116" r="62" fill="none" stroke="#bd3c31" stroke-width="3"/>
    <text fill="#a92e25" font-family="Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="2.1">
