    </text>
    <text x="74" y="128" fill="#4285f4" font-family="Arial, sans-serif" font-size="44" font-weight="900">G</text>
    <text x="112" y="123" fill="#264f8a" font-family="Arial, sans-serif" font-size="21" font-weight="800">Ads</text>
    <path d="M70 139h80" stroke="#4285f4" stroke-width="4"/>
    <path d="M70 139h27" stroke="#ea4335" stroke-width="4"/>
    <path d="M97 139h26" stroke="#fbbc05" stroke-width="4"/>
    <path d="M123 139h27" stroke="#34a853" stroke-width="4"/>
    <path d="M41 116l8 3-8 3-8-3zM179 116l8 3-8 3-8-3z" fill="#bd3c31"/>
    <path d="M110 57l3 7 8 1-6 5 2 8-7-4-7 4 2-8-6-5 8-1z" fill="#c89b2b"/>
