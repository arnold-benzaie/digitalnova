    <circle cx="102" cy="65" r="8" fill="none" stroke="#173c70" stroke-width="4"/>
    <path d="M87 89c4-13 12-18 24-18 9 0 16 3 21 11" fill="none" stroke="#173c70" stroke-width="4" stroke-linecap="round"/>
    <path d="M124 53l16-12 5 6-16 14z" fill="url(#gold)" stroke="#9a6200" stroke-width="1.5"/>
    <text x="110" y="116" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">CONTENT</text>
    <text x="110" y="135" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">MARKETING</text>
    <text x="110" y="151" text-anchor="middle" fill="#b9cae1" font-family="Arial, sans-serif" font-size="7" font-weight="700" letter-spacing="1.5">SPECIALIST</text>
    <path d="M25 155l31-10h108l31 10-17 23-30-9H72l-30 9z" fill="url(#gold)" stroke="#9a6200" stroke-width="2"/>
    <path d="M56 145l16 24h76l16-24z" fill="#e9ab25" opacity=".45"/>
    <text x="110" y="165" text-anchor="middle" fill="#19355e" font-family="Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="1.8">CERTIFIED</text>
    <circle cx="110" cy="193" r="8" fill="#fff" stroke="#d5a129" stroke-width="2"/>
