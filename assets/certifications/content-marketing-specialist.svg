<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" role="img" aria-labelledby="title desc">
  <title id="title">Content Marketing Specialist badge</title>
  <desc id="desc">Navy professional shield with a gold certification ribbon.</desc>
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173c70"/>
      <stop offset="1" stop-color="#081a36"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99100"/>
      <stop offset=".5" stop-color="#ffd86b"/>
      <stop offset="1" stop-color="#b76a00"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0a2540" flood-opacity=".25"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <path d="M49 31h122v92c0 40-25 64-61 82-36-18-61-42-61-82z" fill="url(#shield)" stroke="#6f87aa" stroke-width="5"/>
    <path d="M60 41h100v78c0 33-19 53-50 70-31-17-50-37-50-70z" fill="none" stroke="#d8e2f0" stroke-opacity=".45" stroke-width="2"/>
